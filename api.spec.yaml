openapi: 3.0.0
info:
  title: Battleship Game API
  description: A REST API for managing the gameplay, players, and game state.
  version: 1.0.0
servers:
  - url: http://localhost:5050/api/
paths:
  /users/:
    post:
      summary: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: User created successfully
    get:
      summary: Get the list of users
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
  /games/:
    post:
      summary: Create a new game
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                player1:
                  type: string
                player2:
                  type: string
      responses:
        200:
          description: Game created successfully
    get:
      summary: Get the list of games
      responses:
        200:
          description: List of games
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
    Game:
      type: object
      properties:
        id:
          type: integer
        player1:
          type: string
        player2:
          type: string
