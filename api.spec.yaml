openapi: 3.0.0
info:
  title: Battleship Game API
  description: A REST API for managing the gameplay, players, and game state.
  version: 1.0.0
servers:
  - url: http://localhost:5050/api/
paths:
  /users/:
    post:
      summary: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: User created successfully
    get:
      summary: Get the list of users
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
  /users/login/:
    post:
      summary: Log in or create a new user
      description: Logs in an existing user or provides a warning if the user does not exist. Returns authentication tokens if successful.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: exampleuser
                password:
                  type: string
                  example: examplepassword
      responses:
        '200':
          description: Successful authentication and token issuance
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  access:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: exampleuser
                      email:
                        type: string
                        example: user@example.com
                      first_name:
                        type: string
                        example: John
                      last_name:
                        type: string
                        example: Doe
        '404':
          description: User does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  warning:
                    type: string
                    example: User does not exist. Please create a new account.
  /users/{user_id}:
    get:
      summary: Get a user's profile
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: User not found

  /gameplays/:
    get:
      summary: List all gameplays
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gameplay'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
          content: {}

    post:
      summary: Create a new gameplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Gameplay'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gameplay'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Not Found   

          content: {}
        '500':
          description: Internal Server Error
          content: {}

  /gameplays/{id}/position_ships:
    post:
      summary: Position ships for a gameplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player:
                  type: string
                  description: The player positioning ships (e.g., "player1")
                positions:
                  type: array
                  items:
                    $ref: '#/components/schemas/PositionVector'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the gameplay
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  board:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

        '403':
          description: Forbidden
          content: {}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal Server Error
          content: {}

  /gameplays/{id}/attack:
    get:
      summary: Attack a position in a gameplay
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the gameplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttackInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Attack message
        '201':
          description: Created (game ended)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Game over message
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Forbidden
          content: {}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
    Gameplay:
      type: object
      properties:
        id:
          type: integer
        player1:
          type: string
        player2:
          type: string
    AttackInput:
      type: object
      properties:
        position:
          type: string
    PositionVector:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
